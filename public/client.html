<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Client - WebXR WebRTC Latency Benchmark</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body class="page-client">
    <div id="app">
      <header class="hud">
        <div class="hud-row">
          <strong>Role:</strong> Client (XR Viewer)
          <span id="conn-badge" class="badge">connecting</span>
        </div>
        <div class="hud-row stats">
          <span>WS: <span id="ws-state">-</span></span>
          <span>PC: <span id="pc-state">-</span></span>
          <span>DC: <span id="dc-state">-</span></span>
        </div>
      </header>
      <div class="viewport">
        <canvas id="scene"></canvas>
        <div id="telemetry" class="telemetry-overlay" aria-label="Network telemetry">
          <div class="telemetry-title">Network Telemetry</div>
          <div id="offline-badge" class="offline-badge" hidden>CONNECTION LOST / OFFLINE</div>
          <div class="t-row"><span>RTT</span><span><span id="rtt">-</span> ms</span></div>
          <div class="t-row"><span>One-way (est.)</span><span><span id="ow">-</span> ms</span></div>
          <div class="t-row"><span>Jitter (IA σ)</span><span><span id="jitter">-</span> ms</span></div>
          <div class="t-row"><span>Packet Loss</span><span><span id="loss">0.00</span> %</span></div>
          <div class="t-row"><span>Render FPS</span><span id="fps">-</span></div>
          <div class="t-row"><span>Recv Rate</span><span><span id="rate">0</span> Hz</span></div>
          <div class="t-row"><span>Last Seq</span><span id="seq">-</span></div>
          <div class="t-row mode-row"><span>Mode</span><span id="mode-label" class="mode-value">Raw</span></div>
          <div class="t-actions">
            <button id="mode-toggle" type="button">Switch to Interpolated</button>
            <button id="export-csv" type="button">Download Benchmark CSV</button>
          </div>
        </div>
      </div>
      <section class="log-panel">
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </div>
    <script type="module" src="/js/client.js"></script>
  </body>
</html>
