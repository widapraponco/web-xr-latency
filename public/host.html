<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Host - WebXR WebRTC Latency Benchmark</title>
    <link rel="stylesheet" href="/css/style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.164.1/build/three.module.js"
        }
      }
    </script>
  </head>
  <body class="page-host">
    <div id="app">
      <header class="hud">
        <div class="hud-row">
          <strong>Role:</strong> Host (Edge Simulation Server)
          <span id="mode" class="badge">Mode: AUTO</span>
        </div>
        <div class="hud-row stats">
          <span>WS: <span id="ws-state">-</span></span>
          <span>PC: <span id="pc-state">-</span></span>
          <span>DC: <span id="dc-state">-</span></span>
          <span>Seq: <span id="seq">0</span></span>
          <span>Send: <span id="rate">0</span> Hz</span>
        </div>
        <div class="hud-row hint">Controls: <kbd>M</kbd> toggle Auto/Manual · Arrow keys move cube (Manual)</div>
      </header>
      <canvas id="scene"></canvas>
      <section class="log-panel">
        <h2>Log</h2>
        <pre id="log"></pre>
      </section>
    </div>
    <script type="module" src="/js/host.js"></script>
  </body>
</html>
