<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WebXR WebRTC Latency Benchmark</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <main>
      <h1>WebXR WebRTC Latency Benchmark</h1>
      <p class="subtitle">Lightweight prototype for real-time state sync over WebRTC DataChannels.</p>

      <section class="panel">
        <h2>Session</h2>
        <div class="controls">
          <label for="role">Role</label>
          <select id="role">
            <option value="host">Host</option>
            <option value="client">Client</option>
          </select>
          <button id="connect">Connect &amp; Register</button>
        </div>
        <p id="status">Status: idle</p>
      </section>

      <section class="panel">
        <h2>Log</h2>
        <pre id="log" aria-live="polite"></pre>
      </section>
    </main>

    <script type="module" src="/js/app.js"></script>
  </body>
</html>
